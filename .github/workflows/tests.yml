name: tests

on:
  push:
  pull_request:

jobs:
  r:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.5.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("testthat", "shiny", "shinyjs", "shinythemes", "stringr", "DT", "writexl"))'
      - run: Rscript tests/testthat.R
